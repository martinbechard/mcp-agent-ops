name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run pytest
      - run: uv run ruff check .
      - run: uv run mypy src

  windows-verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.11"
      - run: uv sync --locked
      - run: uv run pytest tests/compatibility/test_claim_cli.py
      - run: uv run pytest tests/integration/stdio/test_stdio_server.py::test_real_stdio_server_initializes_lists_and_invokes_tools
      - run: uv run ruff check .
      - run: uv run mypy src
